[package]
name = "lmt-lsp"

edition.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = ["rustix", "tokio"]

rustix = ["async-lsp/client-monitor", "async-lsp/stdio"]
tokio = ["async-lsp/tokio", "dep:tokio", "dep:tokio-util"]

[dependencies]
lmt-parser = { path = "../../core/parser", version = "0.1.0-alpha.0", public = true }
lmt-synthesis = { path = "../../core/synthesis", version = "0.1.0-alpha.0", public = true }

async-lsp = { version = "0.2.0", default-features = false, features = [
  "omni-trait",
  "tokio",
  "tracing",
] }
env_logger = "0.10.1"
futures = { version = "0.3.28", default-features = false, features = [
  "async-await",
  "std",
] }

im-rc = "15.0.0"
log = "0.4.14"
ropey = "1.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.78"
tokio = { version = "1.17.0", optional = true, default-features = false, features = [
  "full",
] }
tokio-util = { version = "0.7.8", optional = true, features = ["compat"] }
tower = "0.4.13"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"

# async-std = "*"
# tokio_with_wasm = "*"
# wasm-bindgen-futures = "*"
# wasm-timer = "*"
# web-sys = "*"
