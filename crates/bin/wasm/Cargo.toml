[package]
name = "lmt-wasm"

edition.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lmt-lsp = { version = "0.1.0-alpha.0", path = "../lsp", default-features = false }
lmt-parser = { version = "0.1.0-alpha.0", path = "../../core/parser", default-features = false, features = [
  "serde",
] }
lmt-synthesis = { version = "0.1.0-alpha.0", path = "../../core/synthesis", default-features = false, features = [
  "serde",
] }

console_error_panic_hook = "0.1.7"
futures = "0.3.30"
js-sys = "0.3.69"
# tree-sitter = { version = "0.9", package = "tree-sitter-facade" }
wasm-bindgen = "0.2.92"
wasm-bindgen-futures = { version = "0.4.42", features = [
  "futures-core-03-stream",
] }
wasm-streams = "0.4.0"
web-sys = { version = "0.3.69", features = [
  "HtmlTextAreaElement",
  "ReadableStream",
  "WritableStream",
  "console",
] }
# web-tree-sitter-sys = "1.3.0"

bitcode = { version = "0.6.0", features = [
  "serde",
], optional = true, public = true }
# serde-wasm-bindgen = "0.6.4"
tsify = { version = "0.4.5", features = ["js"] }
