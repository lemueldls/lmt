[package]
default-run = "lmt-cli"
name = "lmt-cli"

edition.workspace = true
version.workspace = true

[features]
default = []

[dependencies]
lmt-compiler = { path = "../../core/compiler", version = "0.1.0-alpha.0", public = true }
lmt-parser = { path = "../../core/parser", version = "0.1.0-alpha.0", public = true }
lmt-report = { path = "../../util/report", version = "0.1.0-alpha.0", public = true }
lmt-synthesis = { path = "../../core/synthesis", version = "0.1.0-alpha.0", public = true }

