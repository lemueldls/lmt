[package]
name = "lmt-twoslash"

edition.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
lmt-parser = { version = "0.1.0-alpha.0", path = "../../../core/parser", default-features = false, features = [
  "serde",
] }
lmt-report = { version = "0.1.0-alpha.0", path = "../../../util/report", default-features = false, features = [
  "serde",
] }
lmt-synthesis = { version = "0.1.0-alpha.0", path = "../../../core/synthesis", default-features = false, features = [
  "serde",
] }

ropey = "1.5.0"

[dependencies.napi]
default-features = false
version = "3.0.0-alpha.2"
# see https://nodejs.org/api/n-api.html#node-api-version-matrix
features = ["napi9", "serde-json"]

[dependencies.napi-derive]
features = ["type-def"]
version = "3.0.0-alpha.1"

[build-dependencies]
napi-build = "2.1.3"
