[workspace]
members = ["crates/bin/*", "crates/core/*"]
package.edition = "2024"
package.version = "0.1.0-alpha.0"
resolver = "3"

[workspace.dependencies]
arborium = { version = "2.17.0", default-features = true, features = [
  "lang-rust",
  "lang-python",
  "lang-javascript",
  "lang-typescript",
] }
# tracey = { version = "1.3.0" }
figue = { version = "4.0.1" }
facet = { version = "0.46.0" }
cvc5-rs = { version = "0.3.2" }
anyhow = { version = "1.0" }
thiserror = { version = "2.0" }
tokio = { version = "1", features = ["full"] }
