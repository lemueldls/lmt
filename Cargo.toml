[workspace]
members = ["crates/bin/*", "crates/core/*", "crates/util/*"]
package.version = "0.1.0-alpha.0"
package.rust-version = "1.92"
package.authors = ["Lemuel DLS"]
package.edition = "2024"
package.homepage = "https://github.com/lemueldls/lmt"
package.repository = "https://github.com/lemueldls/lmt"
package.license = "Apache-2.0"
package.categories = ["compilers"]
package.keywords = ["lmt"]
package.readme = "README.md"
resolver = "3"

[workspace.dependencies]

lmt-checker = { path = "crates/core/checker" }
lmt-diagnostics = { path = "crates/util/diagnostics" }
lmt-index = { path = "crates/util/index" }
lmt-syntax = { path = "crates/core/syntax" }

anyhow = { version = "1.0" }
arborium = { version = "2.17.0", default-features = true, features = [
  "lang-javascript",
  "lang-python",
  "lang-rust",
  "lang-typescript",
] }
async-lsp = { version = "0.2.4", features = [
  "client-monitor",
  "forward",
  "omni-trait",
  "stdio",
  "tokio",
  "tracing",
] }
async-process = { version = "2.5.0" }
comemo = { version = "0.5.1" }
crossterm = { version = "0.29.0" }
cvc5-rs = { version = "0.3.2" }
dashmap = { version = "6.1.0" }
dirs = { version = "6.0.0" }
ecow = { version = "0.2.6" }
facet = { version = "0.46.2" }
figue = { version = "4.0.1" }
fs4 = { version = "1", features = ["tokio"] }
futures = { version = "0.3", features = ["alloc"] }
insta = { version = "1.47.2" }
line-col = { version = "0.2.1" }
lsp-types = { version = "0.95.0" }
mmap-sync = { version = "2.0.4" }
parking_lot = { version = "0.12.5", features = [
  "deadlock_detection",
  "nightly",
  # "send_guard",
  # "owning_ref",
  # "arc_lock",
] }
picante = { version = "1.0.0" }
rand = { version = "0.10.1" }
rowan = { version = "0.16.1" }
rustc-hash = { version = "2.1.2" }
salsa = { version = "0.26.2", features = ["unstable"] }
serde = { version = "1.0", features = ["derive"] }
simplelock = { version = "0.4.1" }
slotmap = { version = "1.1.1" }
tacos = { version = "0.1.0" }
thiserror = { version = "2.0" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
toml = { version = "1.1.2+spec-1.1.0" }
tower = { version = "0.5", features = ["util"] }
tower-service = { version = "0.3" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }
typst-timing = { version = "0.14.2" }
typst-utils = { version = "0.14.2" }
unicode-ident = { version = "1.0" }
unicode-math-class = { version = "0.1.0" }
unicode-script = { version = "0.5.8" }
unicode-segmentation = { version = "1.13.2" }
unscanny = { version = "0.1.0" }

walkdir = { version = "2.5.0" }
wasm-bindgen-test = { version = "0.3" }

[workspace.lints.clippy]
blocks_in_conditions = "allow"
comparison_chain = "allow"
iter_over_hash_type = "warn"
manual_is_multiple_of = "allow"
manual_range_contains = "allow"
mutable_key_type = "allow"
uninlined_format_args = "warn"
wildcard_in_or_patterns = "allow"
# derived_hash_with_manual_eq = "allow"
disallowed_methods = "warn"
